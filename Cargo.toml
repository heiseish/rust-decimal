[package]
name = "rust_decimal"
version = "1.40.0"
authors = ["Paul Mason <paul@form1.co.nz>"]
edition = "2021"
rust-version = "1.67.1"
description = "Decimal number implementation written in pure Rust suitable for financial and fixed-precision calculations."
documentation = "https://docs.rs/rust_decimal/"
readme = "./README.md"
repository = "https://github.com/paupino/rust-decimal"
license = "MIT"
keywords = ["decimal", "financial", "fixed", "number", "precision"]
categories = ["data-structures", "mathematics", "science"]
build = "build.rs"
exclude = ["tests/generated/*"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
resolver = "2"
members = [
  ".",
  "./macros",
]

[[example]]
name = "rkyv-remote"
required-features = ["macros"]

[[bench]]
harness = false
name = "comparison"
path = "benches/comparison.rs"

[dependencies]
arbitrary = { version = "1", default-features = false, optional = true }
arrayvec = { version = "0.7", default-features = false }
borsh = { version = "1.1.1", default-features = false, features = [
  "derive",
  "unstable__schema",
], optional = true }
bytes = { version = "1.12.1", default-features = false, optional = true }
diesel = { version = "2.2.3", default-features = false, optional = true }
ndarray = { version = "0.15.6", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false, features = ["i128"] }
postgres-types = { version = "0.2", default-features = false, optional = true }
proptest = { version = "1.11.0", default-features = false, features = ["std"], optional = true }
rand = { version = "0.8", default-features = false, optional = true }
rand-0_9 = { version = "0.9", default-features = false, optional = true, package = "rand" }
rkyv = { version = "0.7.46", default-features = false, features = [
  "size_32",
  "std",
], optional = true }
rocket = { version = "0.5.0-rc.3", default-features = false, optional = true }
rust_decimal_macros = { version = "1", default-features = false, optional = true, path = "macros" }
serde = { version = "1.0.229", default-features = false, optional = true }
serde_json = { version = "1.0", default-features = false, optional = true }
tokio-postgres = { version = "0.7", default-features = false, optional = true }
zmij = { version = "1.0", default-features = false, optional = true }

[dev-dependencies]
bincode = { version = "1.0", default-features = false }
bytes = { version = "1.12.1", default-features = false }
criterion = { version = "0.8", default-features = false }
csv = "1.4.0"
diesel = { version = "2.2.3", default-features = false, features = [
  "mysql",
  "postgres",
] }
futures = { version = "0.3", default-features = false }
postgres = { version = "0.19", default-features = false }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
rand-0_9 = { version = "0.9", default-features = false, features = [
  "thread_rng",
], package = "rand" }
rkyv-0_8 = { version = "0.8.18", package = "rkyv" }
rust_decimal_macros = { path = "macros" }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "test-util",
] }
tokio-postgres = { version = "0.7", default-features = false }
version-sync = { version = "0.9", default-features = false, features = [
  "html_root_url_updated",
  "markdown_deps_updated",
] }

[features]
align16 = []  # Force Decimal to be repr(align16) - the same as u128
borsh = ["dep:borsh", "std"]
c-repr = []  # Force Decimal to be repr(C)
db-diesel2-mysql = ["db-diesel-mysql"]
db-diesel2-postgres = ["db-diesel-postgres"]
db-diesel-mysql = ["diesel/mysql_backend", "std"]
db-diesel-postgres = ["diesel/postgres_backend", "std"]
db-postgres = ["dep:bytes", "dep:postgres-types", "std"]
db-tokio-postgres = ["dep:bytes", "dep:postgres-types", "std"]
default = ["serde", "std"]
legacy-ops = []
macros = ["dep:rust_decimal_macros"]
maths = []
maths-nopanic = ["maths"]
ndarray = ["dep:ndarray"]
proptest = ["dep:proptest"]
rand = ["dep:rand"]
rkyv = ["dep:rkyv"]
rkyv-safe = ["rkyv/validation"]
rocket-traits = ["dep:rocket", "std"]
rust-fuzz = ["dep:arbitrary"]
serde = ["dep:serde"]
serde-arbitrary-precision = ["serde-with-arbitrary-precision"]
serde-bincode = ["serde-str"]  # Backwards compatability
serde-float = ["serde-with-float"]
serde-str = ["serde-with-str"]
serde-with-arbitrary-precision = [
  "serde",
  "serde_json/arbitrary_precision",
  "serde_json/std",
  "zmij",
]
serde-with-float = ["serde"]
serde-with-str = ["serde"]
std = [
  "arrayvec/std",
  "borsh?/std",
  "bytes?/std",
  "rand?/std",
  "rkyv?/std",
  "serde_json?/std",
  "serde?/std",
]
tokio-pg = ["db-tokio-postgres"]  # Backwards compatability
